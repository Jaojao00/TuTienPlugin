# LINH THẠCH NGŨ HÀNH (KHẢM NẠM)
gem_types:
  KIM:
    name: "§eKim Cương Thạch"
    element: "KIM"
    special_effect: "Xuyên Giáp"
    description: "Tăng sát thương nguyên tố Kim và khả năng xuyên phá giáp phòng ngự."
  MOC:
    name: "§aThanh Mộc Thạch"
    element: "MOC"
    special_effect: "Hút Máu"
    description: "Tăng sát thương nguyên tố Mộc và hồi phục sinh lực tương ứng sát thương gây ra."
  THUY:
    name: "§bBăng Phách Thạch"
    element: "THUY"
    special_effect: "Làm Chậm"
    description: "Tăng sát thương nguyên tố Thủy và gây hiệu ứng làm chậm đóng băng kẻ địch."
  HOA:
    name: "§cLiệt Hỏa Thạch"
    element: "HOA"
    special_effect: "Thiêu Đốt"
    description: "Tăng sát thương nguyên tố Hỏa và đốt cháy thiêu đốt sinh mệnh đối phương."
  THO:
    name: "§6Huyền Thổ Thạch"
    element: "THO"
    special_effect: "Phản Đòn"
    description: "Tăng hộ thể phòng ngự và phản chấn sát thương đối phương tấn công vào."

