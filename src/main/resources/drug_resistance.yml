# ═══════════════════════════════════════════════════════════════
# CẤU HÌNH KHÁNG THUỐC (DRUG RESISTANCE CONFIGURATION - PHASE 3.1)
# ═══════════════════════════════════════════════════════════════

drug-resistance:
  max-resistance: 100.0
  reduction-coefficient: 0.60 # Hệ số C (tối đa giảm 60% hiệu quả)
  min-efficiency: 0.20        # Sàn hiệu quả tối thiểu M_min (20%)

  # Suy giảm kháng thuốc khi online không dùng thuốc cùng nhóm
  decay:
    enabled: true
    interval-seconds: 180      # 3 phút online
    amount: 1.0                # Giảm 1.0 điểm kháng
    require-online: true

  # 6 Nhóm Kháng Thuốc Độc Lập
  groups:
    CULTIVATION:
      name: "Tu Luyện & Hấp Thu"
      description: "Đan tăng tu vi, gia tốc hấp thu linh khí."
    RECOVERY:
      name: "Hồi Phục Sinh Lực"
      description: "Đan hồi máu, hồi phục linh lực."
    BREAKTHROUGH:
      name: "Hỗ Trợ Đột Phá"
      description: "Đan gia tăng tỷ lệ phá cảnh."
    BODY:
      name: "Cường Thân Tôi Thể"
      description: "Đan tăng thể chất, phòng ngự."
    SPIRIT:
      name: "Ngưng Thần Luyện Hồn"
      description: "Đan tăng ngộ tính, thần thức."
    COMBAT:
      name: "Cường Hóa Chiến Đấu"
      description: "Đan tăng sát thương, bộc phát sức mạnh."
