alchemy:
  furnace:
    base-duration-seconds: 15
    temperature:
      min: 20
      max: 1200
      default-ideal: 500
      default-min-tolerance: 420
      default-max-tolerance: 580
      default-cooling-rate: 12.0
      default-explosion-temp: 900
    escrow:
      lock-ingredients: true
      save-on-crash: true

